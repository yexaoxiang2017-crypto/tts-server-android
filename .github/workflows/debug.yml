name: Build Debug

on:
  workflow_dispatch:
  push:
    branches:
      - openclaw-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Init Signature
        run: |
          keytool -genkeypair -noprompt -keystore "$GITHUB_WORKSPACE/key.jks" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,O=Debug,C=CN"
          printf 'KEY_PATH=../key.jks\nKEY_PASSWORD=android\nALIAS_NAME=androiddebugkey\nALIAS_PASSWORD=android\n' > local.properties
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --warning-mode all
      - name: Collect APKs
        run: |
          mkdir -p out
          find . -name '*.apk' -not -path './.git/*' -exec cp -v {} out/ \;
          ls -l out
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: out/*.apk
          if-no-files-found: error

      # 直链下载：固定 tag ci-latest，资源每次覆盖，手机上点链接直接下 .apk
      - name: Publish to Release (ci-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ASSET="tts-debug.apk"
          APK=$(ls out/*.apk | head -1)
          cp "$APK" "$ASSET"
          gh release view ci-latest >/dev/null 2>&1 || \
            gh release create ci-latest --prerelease --title "CI 最新构建" \
              --notes "由 OpenClaw 流水线自动生成。标签固定为 ci-latest，资源每次覆盖。"
          gh release upload ci-latest "$ASSET" --clobber
          echo "APK_URL=https://github.com/${{ github.repository }}/releases/download/ci-latest/$ASSET"
