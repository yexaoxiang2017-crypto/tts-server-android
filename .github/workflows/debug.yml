name: Build Debug

on:
  workflow_dispatch:
  push:
    branches:
      - openclaw-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Init Signature
        run: |
          keytool -genkeypair -noprompt -keystore "$GITHUB_WORKSPACE/key.jks" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,O=Debug,C=CN"
          printf 'KEY_PATH=../key.jks\nKEY_PASSWORD=android\nALIAS_NAME=androiddebugkey\nALIAS_PASSWORD=android\n' > local.properties
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache --parallel --daemon --warning-mode all
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TTS_Server_debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
